<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,s,d)=>cl((t-s)/d);
const eOC=x=>1-Math.pow(1-x,3);
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eOB=(x,k=1.7)=>{x=cl(x);return 1+(k+1)*Math.pow(x-1,3)+k*Math.pow(x-1,2)};
const eIn=x=>x*x*x;
const lerp=(a,b,k)=>a+(b-a)*k;
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function set(el,o){for(const k in o)el.style[k]=o[k]}
// pop-in/out helper: visible window [a,b], enter dur di, exit dur do
function win(t,a,b,di=.35,dout=.25){ if(t<a||t>b+dout) return [0,0]; return [P(t,a,di), 1-P(t,b,dout)]; }

// ---------- grain ----------
const gctx=$('grain').getContext('2d');
const gtile=document.createElement('canvas');gtile.width=gtile.height=256;
{const c=gtile.getContext('2d');const im=c.createImageData(256,256);const r=rnd(7);for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}c.putImageData(im,0,0)}
function grain(f){const r=rnd(f*31+5);const ox=Math.floor(r()*256),oy=Math.floor(r()*256);gctx.save();gctx.translate(-ox,-oy);gctx.fillStyle=gctx.createPattern(gtile,'repeat');gctx.fillRect(0,0,1080+256,1920+256);gctx.restore()}

// ---------- captions ----------
function chunkAt(t){
  let c=-1; for(let i=0;i<CHUNKS.length;i++){ if(CHUNKS[i][0][0]<=t) c=i; }
  if(c<0) return -1;
  const next = c+1<CHUNKS.length ? CHUNKS[c+1][0][0] : VIDEO_END;
  const last = CHUNKS[c][CHUNKS[c].length-1][0];
  if(t > Math.min(next, last+1.1)) return -1;
  return c;
}
let builtChunk=-2;
function buildChunk(c){
  const cap=$('cap'); cap.innerHTML='';
  if(c<0) return;
  for(const [ts,txt,sty] of CHUNKS[c]){
    const s=document.createElement('span'); s.className='w '+(sty||''); s.dataset.t=ts; s.dataset.sty=sty||'';
    if(sty==='green'){const h=document.createElement('span');h.className='hl';s.appendChild(h)}
    s.appendChild(document.createTextNode(sty==='big'?txt:txt));
    if(sty==='saffron'){const u=document.createElement('span');u.className='ul';s.appendChild(u)}
    if(sty==='strike'){const u=document.createElement('span');u.className='st';s.appendChild(u)}
    cap.appendChild(s);
  }
}
function captions(t,m,endK){
  const c=chunkAt(t);
  if(c!==builtChunk){buildChunk(c);builtChunk=c}
  const cap=$('cap');
  const bottomA=1920-1395, bottomB=1920-1150;
  cap.style.bottom=lerp(bottomA,bottomB,m)+'px';
  cap.style.opacity=1-endK;
  for(const s of cap.children){
    const ts=+s.dataset.t, sty=s.dataset.sty, k=P(t,ts,.14);
    const sc = k<=0?0.5:lerp(.55,1,eOB(k,2.2));
    s.style.opacity = k<=0?0:cl(k*2.5);
    let rot = sty==='hand'?-5:0;
    s.style.transform=`translateY(${(1-eOC(k))*18}px) scale(${sc}) rotate(${rot}deg)`;
    if(sty==='green'){const w=eOC(P(t,ts+.05,.22)); s.querySelector('.hl').style.width=(w*100)+'%'}
    if(sty==='saffron'){s.querySelector('.ul').style.width=(eOC(P(t,ts+.1,.3))*(s.offsetWidth-8))+'px'}
    if(sty==='strike'){s.querySelector('.st').style.width=(eOC(P(t,ts+.22,.2))*(s.offsetWidth+8))+'px'}
    if(sty==='ai'){s.style.backgroundSize='200% 100%';s.style.backgroundPosition=`${(t*80)%200}% 0`}
  }
}

// ---------- frame ----------
const vid=$('vid');
async function render(t, frameSrc, fidx){
  if(frameSrc && vid.dataset.src!==frameSrc){ vid.src=frameSrc; vid.dataset.src=frameSrc; await vid.decode(); }
  const m = (t<T.end) ? eIO(P(t,T.modeB,.5)) : 1;           // mode B amount
  const endK = eOC(P(t,T.end,.4));                            // end card amount
  const mb = m*(1-endK);                                      // card-ness (returns to full at end)

  // background for mode B
  $('bgB').style.opacity=m; $('grid').style.opacity=m*.9;
  $('grid').style.backgroundPosition=`0 ${-t*20}px`;
  // video box
  const bx=lerp(0,90,mb), by=lerp(0,130,mb), bw=lerp(1080,900,mb), bh=lerp(1920,930,mb), br=lerp(0,44,mb);
  set($('vbox'),{left:bx+'px',top:by+'px',width:bw+'px',height:bh+'px',borderRadius:br+'px'});
  const iw=lerp(1080,900,mb), ih=lerp(1920,1600,mb), it=lerp(0,-110,mb);
  // zoom / punch / shake
  let z;
  if(t<T.punch) z=1+0.05*(t/T.punch);
  else if(t<T.modeB) z=1.17+0.01*P(t,T.punch,1.8);
  else if(t<T.splice2) z=lerp(1.17,1.0,eIO(P(t,T.modeB,.5)))+0.03*P(t,T.modeB+.5,4);
  else if(t<T.end) z=1.09+0.02*P(t,T.splice2,6);
  else z=1.12;
  let sx=0,sy=0;
  const sh=P(t,T.stamp,.35); if(sh>0&&sh<1){const a=22*(1-sh);sx=a*Math.sin(t*97);sy=a*Math.cos(t*83)}
  const two=P(t,T.two,.25); if(two>0&&two<1){const a=10*(1-two);sy+=a*Math.sin(t*120)}
  set(vid,{width:iw+'px',height:ih+'px',left:'0px',top:it+'px',transform:`translate(${sx}px,${sy}px) scale(${z})`,
    filter: endK>0?`blur(${endK*26}px) brightness(${1-endK*.55})`:'none'});
  $('vign').style.opacity=1-m*0.6;

  // ---------- title -> pill ----------
  {
    const inn=$('titleInner'); const ki=P(t,0,.45), kp=eIO(P(t,T.titleToPill,.45)), out=P(t,T.pillOut,.25);
    const sc=lerp(1,.46,kp); const ty=lerp(0,-55,kp);
    set(inn,{transform:`translateY(${ty}px) scale(${sc*lerp(.7,1,eOB(ki))})`,background:`rgba(8,16,13,${.78*kp})`,
      border:`${kp>0?3:0}px solid rgba(255,255,255,${.15*kp})`});
    $('title').style.opacity = cl(ki*3)*(1-out);
    $('tDeg').querySelector('.strk').style.width = (eOC(P(t,.95,.3))*(($('tDeg').offsetWidth)+12))+'px';
    $('tVs').style.transform=`rotate(-8deg) scale(${eOB(P(t,.3,.3),2.5)})`;
    $('tSk').style.transform=`translateX(${(1-eOC(P(t,.45,.35)))*80}px)`; $('tSk').style.opacity=P(t,.45,.2);
  }

  // ---------- mode A cards ----------
  {
    const [inS,outS]=win(t,T.skillsCard,T.cardsOut,.4,.28);
    const mv=eIO(P(t,T.tie,.35));
    const leftS=lerp(305,60,mv);
    set($('cSk'),{left:leftS+'px',top:(1415+(1-eOB(inS))*300+(1-outS)*320)+'px',opacity:Math.min(cl(inS*3),outS),display:inS>0?'block':'none',
      boxShadow: t>T.stamp? `0 0 ${40*(1-P(t,T.stamp,.8))+0}px rgba(61,220,132,${.9*(1-P(t,T.stamp,.8))}), 0 20px 50px rgba(0,0,0,.5)`:'0 20px 50px rgba(0,0,0,.5)'});
    const [inD,outD]=win(t,T.tie,T.cardsOut,.38,.28);
    set($('cDg'),{left:(550+(1-eOB(inD))*560)+'px',top:(1415+(1-outD)*320)+'px',opacity:Math.min(cl(inD*3),outD),display:inD>0?'block':'none',
      filter:`grayscale(${.75*P(t,T.stamp+.05,.2)})`});
    $('tie').style.transform=`rotate(${Math.sin((t-T.tie)*6)*12*Math.exp(-(t-T.tie)*1.2)}deg)`;$('tie').style.transformOrigin='35px 10px';
    const st=P(t,T.stamp,.16);
    set($('stamp'),{display:st>0&&t<T.cardsOut+.3?'block':'none',opacity:st>0?cl(st*4)*(1-P(t,T.cardsOut,.28)):0,transform:`translateY(${(1-P(t,T.cardsOut,.28)>0?0:0)+P(t,T.cardsOut,.28)*320}px) rotate(-9deg) scale(${lerp(2.6,1,eIn(st))})`});
  }

  // ---------- mode B: "2" + coins ----------
  {
    const [i2,o2]=win(t,T.two,T.p1,.28,.22);
    set($('two'),{opacity:Math.min(cl(i2*3),o2),display:i2>0?'block':'none',transform:`scale(${lerp(1,.85,1-o2)})`});
    $('twoN').style.transform=`scale(${lerp(3,1,eOC(i2))})`;
    set($('tl1'),{opacity:P(t,T.two+.15,.2),transform:`translateX(${(1-eOC(P(t,T.two+.15,.3)))*60}px)`});
    set($('tl2'),{opacity:P(t,T.coins,.15),transform:`scale(${eOB(P(t,T.coins,.3),2)})`,transformOrigin:'0 50%'});
    const rk=P(t,T.two,.5); set($('ring'),{left:(230-rk*260)+'px',top:(170-rk*260)+'px',width:(rk*520)+'px',height:(rk*520)+'px',opacity:rk>0&&rk<1?1-rk:0});
    // coins
    const cc=$('coins'); if(!cc.children.length){for(let i=0;i<16;i++){const d=document.createElement('div');d.className='abs coin';d.textContent='₹';cc.appendChild(d)}}
    const r=rnd(42); const dt=t-T.coins;
    [...cc.children].forEach((d,i)=>{
      const vx=(r()-.5)*1500, vy=-900-r()*900, rs=(r()-.5)*900, del=r()*.12;
      const u=dt-del; if(u<0||u>1.6){d.style.display='none';return}
      d.style.display='flex';
      const x=330+vx*u, y=1380+vy*u+0.5*2600*u*u;
      set(d,{left:x+'px',top:y+'px',transform:`rotate(${rs*u}deg) scale(${lerp(.4,1,cl(u*6))})`,opacity:1-P(u,1.1,.5)});
    });
  }

  // ---------- panels 01 / 02 ----------
  {
    const [a1,o1]=win(t,T.p1,T.example,.35,.25);
    set($('p1'),{display:a1>0?'block':'none',opacity:Math.min(cl(a1*3),o1),transform:`translateY(${(1-eOB(a1))*120 - (1-o1)*80}px) rotate(${(1-eOC(a1))*-6}deg)`});
    const [a2,o2]=win(t,T.p2,T.example,.35,.25);
    const pulse=1+0.06*Math.sin(P(t,T.ai,.5)*Math.PI);
    set($('p2'),{display:a2>0?'block':'none',opacity:Math.min(cl(a2*3),o2),transform:`translateY(${(1-eOB(a2))*120-(1-o2)*80}px) rotate(${(1-eOC(a2))*6}deg) scale(${pulse})`});
    const ai=$('aiT'); set(ai,{background:'linear-gradient(100deg,#4D7CFF,#9B5CFF,#FF5CC8,#4D7CFF)',backgroundSize:'300% 100%',backgroundPosition:`${(t*60)%300}% 0`,
      webkitBackgroundClip:'text',backgroundClip:'text',color:'transparent'});
    const [ap,op]=win(t,T.p2,T.example,.3,.2); set($('plus'),{opacity:Math.min(ap,op),transform:`scale(${eOB(ap,3)}) rotate(${(1-ap)*180}deg)`});
  }

  // ---------- example slots / tiles ----------
  {
    const exOut = 1-P(t,T.end,.3);
    const shrink = eIO(P(t,T.more,.35));
    const tileTf=(k)=>`translateY(${(1-eOB(k))*80 - shrink*40}px) scale(${lerp(.6,1,eOB(k))*lerp(1,.86,shrink)})`;
    [['s1',T.web],['s2',T.content],['s3',T.edit]].forEach(([id,fill],i)=>{
      const k=P(t,T.example+i*.1,.25); const gone=P(t,fill,.15);
      set($(id),{display:k>0&&gone<1?'block':'none',opacity:k*(1-gone)*.9,transform:`scale(${lerp(.8,1,eOC(k))})`});
    });
    // web
    const kw=P(t,T.web,.35); set($('tWeb'),{display:kw>0?'block':'none',opacity:cl(kw*3)*exOut,transform:tileTf(kw)});
    const lw=t-T.web; const grow=(id,d,w)=>{$(id).style.width=(eOC(P(lw,d,.25))*w)+'px'};
    grow('wNav',.15,264);grow('wH1',.3,200);grow('wH2',.42,150);grow('wImg',.55,264);grow('wBtn',.7,120);
    const cu=eIO(P(lw,.75,.45)); set($('wCur'),{left:lerp(240,70,cu)+'px',top:lerp(320,248,cu)+'px'});
    const clk=P(lw,1.25,.25); $('wBtn').style.transform=`scale(${clk>0&&clk<1?1-.12*Math.sin(clk*Math.PI):1})`;
    $('wBtn').style.boxShadow= clk>0&&clk<1?`0 0 0 ${clk*24}px rgba(255,200,61,${1-clk})`:'none';
    // content
    const kc=P(t,T.content,.35); set($('tCon'),{display:kc>0?'block':'none',opacity:cl(kc*3)*exOut,transform:tileTf(kc)});
    const lc=t-T.content; const n=Math.floor(12400*eOC(P(lc,.2,1.6)));
    $('cCount').textContent= n>=1000?(n/1000).toFixed(1)+'K':n;
    $('cHeart').style.transform=`scale(${1+.25*Math.abs(Math.sin(lc*7))*(lc>0?1:0)})`;
    const cf=$('cFloat'); if(!cf.children.length){for(let i=0;i<6;i++){const d=document.createElement('div');d.className='abs';d.textContent='♥';d.style.color='#ff3b6b';d.style.fontSize='30px';cf.appendChild(d)}}
    [...cf.children].forEach((d,i)=>{const u=((lc-i*.28)%1.4+1.4)%1.4; const on=lc-i*.28>0; d.style.display=on?'block':'none';
      set(d,{left:(240+Math.sin(u*6+i)*14)+'px',top:(150-u*120)+'px',opacity:1-u/1.4})});
    $('cPh').style.backgroundPosition=`${lc*40}px 0`;
    // editing
    const ke=P(t,T.edit,.35); set($('tEd'),{display:ke>0?'block':'none',opacity:cl(ke*3)*exOut,transform:tileTf(ke)});
    const le=t-T.edit;
    [['eTr1',.1,200],['eTr2',.2,240],['eTr3',.3,150]].forEach(([id,d,w])=>{const k=eOB(P(le,d,.3));set($(id),{width:w+'px',transform:`translateX(${(1-k)*280}px)`})});
    const ph=(le%2.2)/2.2; $('eHead').style.left=(14+ph*268)+'px';
    $('ePrev').style.filter=`hue-rotate(${ph*360}deg)`;
  }

  // ---------- many more chips ----------
  {
    const labels=['Scripts','Thumbnails','Ads','Automation'];
    const xs=[95,300,560,700];
    const ch=$('chips'); if(!ch.children.length){labels.forEach((l,i)=>{const d=document.createElement('div');d.className='abs chipm';d.textContent=l;d.style.left=xs[i]+'px';ch.appendChild(d)})}
    const exOut=1-P(t,T.end,.3);
    [...ch.children].forEach((d,i)=>{const k=P(t,T.more+.05+i*.14,.3);
      set(d,{display:k>0?'block':'none',opacity:cl(k*3)*exOut,transform:`translateY(${(1-eOB(k,2.4))*60}px) scale(${lerp(.5,1,eOB(k,2.4))})`})});
  }

  captions(t,m,endK);

  // ---------- end card ----------
  {
    const e=$('end'); e.style.opacity=endK; e.style.display=endK>0?'block':'none';
    const lt=t-T.end;
    set($('endQ'),{transform:`translateY(${(1-eOB(P(lt,.15,.4)))*60}px) scale(${lerp(.7,1,eOB(P(lt,.15,.4)))})`,opacity:P(lt,.15,.15)});
    set($('optA'),{transform:`translateX(${(1-eOC(P(lt,.4,.35)))*-700}px)`});
    const tapK=P(lt,1.25,.3);
    set($('optB'),{transform:`translateX(${(1-eOC(P(lt,.55,.35)))*700}px) scale(${tapK>0&&tapK<1?1-.06*Math.sin(tapK*Math.PI):1})`});
    set($('endC'),{opacity:P(lt,.8,.2),transform:`translateY(${Math.sin(lt*7)*8}px)`});
    const tk=P(lt,1.25,.5); set($('tap'),{left:(780-tk*30)+'px',top:(1025-tk*30)+'px',width:(120+tk*60)+'px',height:(120+tk*60)+'px',opacity:tk>0&&tk<1?1-tk:0});
  }

  grain(fidx||Math.floor(t*30));
  return true;
}
window.render=render;
window.ready=document.fonts.ready.then(()=>true);
</script>
</body></html>
