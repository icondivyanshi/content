<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><title>पत्थरों के पार — film</title>
<style>
@font-face{font-family:'Amita';src:url(fonts/amita-devanagari-700-normal.woff2);font-weight:700}
@font-face{font-family:'Amita';src:url(fonts/amita-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:'Rozha One';src:url(fonts/rozha-one-devanagari-400-normal.woff2)}
@font-face{font-family:'Rozha One';src:url(fonts/rozha-one-latin-400-normal.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="cv" width="1080" height="1080"></canvas>
<script src="art.js"></script>
<script>
// =================== SCENES ===================
const heroAt = (t, cx, cy, r) => ({ x: cx + Math.cos(t) * r, y: cy + Math.sin(t) * r * 0.6 });
const Q = new URLSearchParams(location.search), SHOW_TEXT = Q.has('text'), SHOW_BORDER = Q.has('border');
if (!SHOW_TEXT) captionAt = () => {};
const SC = [];
const scene = (d, fn, cue) => SC.push({ d, fn, cue });

// 1 — the pond, the stones, the rule
scene(7.5, (c, t) => {
  const z = lerp(1, 1.05, t / 7.5); c.translate(W / 2, H / 2); c.scale(z, z); c.translate(-W / 2, -H / 2 - 10);
  c.globalAlpha = E(t, 0, 0.8); pondWater(c); c.globalAlpha = 1;
  school(c, t, { alpha: E(t, 0.6, 1.8) });
  fish(c, { x: P0.x + 210 + Math.sin(t * 1.3) * 20, y: P0.y - 60 + Math.cos(t * 1.3) * 14, rot: -0.3 + Math.cos(t * 1.3) * 0.3, s: 0.44, seed: 1, alpha: E(t, 1, 2), wig: Math.sin(t * 9) * 0.3 });
  ringStones(c, { appear: 1.6, t });
  c.setTransform(c.__base);
  captionAt(c, t, 4.4, 7.5, [{ t: 'पत्थरों के पार ' }, { t: 'मत', c: VERM }, { t: ' जाओ।' }], { font: 'Rozha One', size: 60 });
});

// 2 — "what's beyond?" / "only darkness"
scene(8, (c, t) => {
  const z = lerp(1, 2.0, E(t, 0, 2.6)), fx = lerp(540, 820, E(t, 0, 2.6)), fy = lerp(560, 560, 1);
  c.translate(W / 2, H / 2); c.scale(z, z); c.translate(-fx, -fy);
  // darkness beyond the ring
  const da = E(t, 3.4, 5.6);
  c.save(); c.beginPath(); c.rect(-200, -200, 1600, 1600); c.ellipse(P0.x, P0.y, P0.rx + 34, P0.ry + 34, 0, 0, Math.PI * 2, true); c.clip('evenodd');
  hatch(c, da, 0, 0, 1300, 1150, 9, 300); c.restore();
  pondWater(c); school(c, t + 7.5, { alpha: 1 });
  const turn = E(t, 5.6, 6.3);
  const hx = lerp(lerp(750, 842, E(t, 0.3, 2.6)), 700, E(t, 6.0, 8)), hy = 545;
  fish(c, { x: hx, y: hy, rot: lerp(0, Math.PI, turn), s: 0.34, seed: 1, eye: turn > 0.2 ? 'scared' : 'open', wig: Math.sin(t * 10) * 0.3 });
  fish(c, { x: lerp(640, 745, E(t, 2.4, 3.6)), y: 625, rot: -0.15, s: 0.62, col: '#6e7a45', band: OCHRE, seed: 9, alpha: E(t, 2.4, 3.2), barbels: true, mouth: t > 4.2 && t < 5.6 ? 0.5 + 0.5 * Math.sin(t * 14) : 0, wig: Math.sin(t * 3) * 0.1 });
  ringStones(c);
  c.setTransform(c.__base);
  captionAt(c, t, 1.0, 3.9, [{ t: 'पत्थरों के पार क्या है?' }], { size: 50 });
  captionAt(c, t, 4.2, 8, [{ t: 'सिर्फ ' }, { t: 'अँधेरा', c: VERM }, { t: '।' }], { font: 'Rozha One', size: 64 });
});

// 3 — days, years: same water, same stones, same fear
scene(9, (c, t) => {
  const cyc = 3, ph = (t / cyc) % 1, day = ph < 0.62;
  const u = day ? ph / 0.62 : (ph - 0.62) / 0.38;
  const bx = lerp(150, 930, u), by = 150 - Math.sin(u * Math.PI) * 60;
  if (day) sun(c, bx, by, 46, t, TURM, 70); else moon(c, bx, by, 40, 71);
  pondWater(c);
  [[P0.x - 250, P0.y - 120], [P0.x + 230, P0.y + 150], [P0.x - 180, P0.y + 170], [P0.x + 260, P0.y - 140]].forEach(([x, y], i) => lotus(c, x, y, 0.75, day ? Math.sin(u * Math.PI) : 0, 80 + i * 30));
  school(c, t * 3, {});
  const fade = E(t, 0.5, 8.5);
  const a = t * 2.2; fish(c, { x: P0.x + 180 + Math.cos(a) * 40, y: P0.y - 20 + Math.sin(a) * 28, rot: a + Math.PI / 2, s: lerp(0.3, 0.42, fade), col: mixHex(VERM, '#8f857a', fade), band: mixHex(TURM, '#b9ae98', fade), seed: 1, wig: Math.sin(t * 9) * 0.3 });
  ringStones(c);
  if (!day) { c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = 'rgba(70,90,150,' + (0.35 * Math.sin(u * Math.PI) + 0.12) + ')'; c.fillRect(0, 0, W, H); c.restore(); }
  captionAt(c, t, 1.6, 9, [{ t: 'वही पानी। वही पत्थर। ' }, { t: 'वही डर।', c: VERM }], { size: 50 });
}, null);

// 4 — the drought
scene(7, (c, t) => {
  const w = 1 - 0.65 * E(t, 0.4, 5.2);
  ink(c, ell(P0.x, P0.y, P0.rx, P0.ry, 48, 0.02), { fill: '#d9b47a', lw: 3, seed: 500 });
  CRACKS.forEach((p, i) => { const k = E(t, 0.8 + i * 0.05, 2.6 + i * 0.05); if (k > 0) ink(c, p.slice(0, Math.max(2, Math.ceil(p.length * k))), { close: false, lw: 2, seed: 800 + i, stroke: '#5a3a1a' }); });
  pondWater(c, w, '#b9c9a4');
  school(c, t * 1.6, { sc: w * 0.95, jitter: 2 * E(t, 3, 6) });
  fish(c, { x: P0.x + P0.rx * w * 0.7, y: P0.y, rot: Math.sin(t * 2) * 0.4, s: 0.36, col: mixHex(VERM, '#8f857a', 0.8 - 0.4 * E(t, 4, 7)), band: TURM, seed: 1, wig: Math.sin(t * 12) * 0.3 });
  ringStones(c);
  const sr = lerp(48, 105, E(t, 0, 6));
  sun(c, 880, 170, sr, t * 2, mixHex(TURM, '#e0581f', E(t, 1, 6)), 70);
  c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = 'rgba(230,150,60,' + 0.28 * E(t, 0.5, 6) + ')'; c.fillRect(0, 0, W, H); c.restore();
  captionAt(c, t, 3.4, 7, [{ t: 'फिर ' }, { t: 'गर्मी', c: VERM }, { t: ' आई।' }], { size: 54 });
});

// 5 — the leap; the darkness was never there; a river
scene(8.5, (c, t) => {
  const hxPath = (t) => t < 1 ? lerp(P0.x + P0.rx * 0.35 * 0.7, 842, E(t, 0, 1)) : t < 1.9 ? lerp(842, 1010, (t - 1) / 0.9) : lerp(1010, 2050, E(t, 1.9, 6.6));
  const hx = hxPath(t), camx = clamp(hx, 540, 2050) + 0 * t;
  c.translate(W / 2 - camx, 0);
  // river at far right
  const rx0 = 1840, rx1 = 2280;
  { const Lp = [], Rp = []; for (let y = -40; y <= 1120; y += 40) { Lp.push([rx0 + Math.sin(y / 170) * 14, y]); Rp.push([rx1 + Math.sin(y / 150 + 1) * 14, y]); } ink(c, Lp.concat(Rp.reverse()), { fill: '#a9c8d4', lw: 3, seed: 950 }); }
  for (let k = 0; k < 26; k++) { const y = ((k * 42 + t * 90) % 1120) - 20; const p = []; for (let x = rx0 + 18; x <= rx1 - 18; x += 40) p.push([x, y + Math.sin(x / 40 + k) * 7]); ink(c, p, { close: false, lw: 1.5, stroke: INDI, seed: 960 + k, alpha: 0.8 }); }
  [[1900, 200], [2230, 420], [1920, 820], [2210, 900]].forEach(([x, y], i) => lotus(c, x, y, 0.8, 1, 990 + i * 20));
  for (let k = 0; k < 7; k++) fish(c, { x: rx0 + 60 + (k * 67) % 380, y: ((k * 160 + t * 120) % 1150) - 40, rot: Math.PI / 2, s: 0.22, col: [TURM, PINK, LEAF, OCHRE][k % 4], detail: 0, lw: 1.5, seed: 30 + k, wig: Math.sin(t * 8 + k) * 0.3 });
  // trail
  ink(c, [[842, 560], [1000, 565], [1300, 555], [1600, 570], [1850, 560]], { close: false, lw: 10, stroke: '#9fbcc3', seed: 970, alpha: E(t, 1.7, 2.3) });
  // darkness, dissolving as she advances
  const dk = 1 - E(hx, 1080, 1750);
  hatch(c, dk, 935, 0, 1840, 1080, 9, 300);
  // dry pond
  ink(c, ell(P0.x, P0.y, P0.rx, P0.ry, 48, 0.02), { fill: '#d9b47a', lw: 3, seed: 500 });
  CRACKS.forEach((p, i) => ink(c, p, { close: false, lw: 2, seed: 800 + i, stroke: '#5a3a1a' }));
  pondWater(c, 0.35, '#b9c9a4'); school(c, 8 + t * 1.6, { sc: 0.33, jitter: 2 });
  ringStones(c, { gap: 0 });
  const jump = t > 1 && t < 1.9 ? Math.sin((t - 1) / 0.9 * Math.PI) : 0;
  if (jump > 0) ink(c, ell(hx, 600, 30 * (1 - jump * 0.4), 8, 12), { fill: 'rgba(27,18,11,.25)', stroke: null, seed: 5 });
  const bright = E(hx, 1200, 1900);
  fish(c, { x: hx, y: 560 - jump * 90 + (t > 6.6 ? Math.sin(t * 2) * 10 : 0), rot: t > 6.6 ? -0.25 : -jump * 0.5 + Math.sin(t * 4) * 0.06, s: 0.38 * (1 + jump * 0.5), col: mixHex('#a58d7e', VERM, bright), band: TURM, seed: 1, wig: Math.sin(t * 12) * 0.3 });
  c.setTransform(c.__base);
  if (t > 1.88 && t < 2.4) { c.save(); c.globalAlpha = 1 - (t - 1.88) / 0.52; ink(c, ell(W / 2 + (hx - camx) + 10, 575, 40 + (t - 1.88) * 120, 12 + (t - 1.88) * 40, 20), { lw: 2, stroke: INDI, seed: 6 }); c.restore(); }
  captionAt(c, t, 6.4, 8.5, [{ t: 'एक ' }, { t: 'नदी', c: INDI }, { t: '।' }], { font: 'Rozha One', size: 72 });
}, 'leap');

// 6 — the river becomes the sea; thousands of fish
const SEA = (() => { const R = rng(61), a = []; const cols = [TURM, PINK, LEAF, OCHRE, '#d9692f', SKY]; for (let i = 0; i < 380; i++) a.push({ x: R() * 1300 - 110, y: 1900 + R() * 1000, d: R() < 0.5 ? 1 : -1, sp: 20 + R() * 40, s: 0.12 + R() * 0.1, col: cols[i % cols.length], seed: i }); return a; })();
scene(8, (c, t) => {
  const cy = lerp(500, 2350, E(t, 0, 6.5));
  c.translate(0, H / 2 - cy);
  const cx = (y) => 540 + 140 * Math.sin(y / 320), hw = (y) => y < 1500 ? 120 : y < 1950 ? 120 + Math.pow((y - 1500) / 450, 2) * 500 : 700;
  // banks + grass
  const R = rng(5);
  for (let k = 0; k < 90; k++) { const y = R() * 2000, s = R() < 0.5 ? -1 : 1, x = cx(y) + s * (hw(y) + 40 + R() * 300); for (let g = -1; g <= 1; g++) ink(c, [[x, y], [x + g * 9, y - 26]], { close: false, lw: 1.6, stroke: LEAF, seed: 1200 + k * 3 + g }); }
  const L = [], Rr = []; for (let y = -100; y <= 1980; y += 40) { L.push([cx(y) - hw(y), y]); Rr.push([cx(y) + hw(y), y]); }
  ink(c, L.concat([[-200, 1980], [-200, 3300], [1300, 3300], [1300, 1980]]).concat(Rr.reverse()), { fill: '#a9c8d4', lw: 3, seed: 1300 });
  for (let y = -80; y < 3200; y += 38) { const yy = y + (t * 60) % 38; const x0 = yy > 1950 ? -60 : cx(yy) - hw(yy) + 14, x1 = yy > 1950 ? 1140 : cx(yy) + hw(yy) - 14; const p = []; for (let x = x0; x <= x1; x += 36) p.push([x, yy + Math.sin(x / 36 + y) * 6]); if (p.length > 1) ink(c, p, { close: false, lw: 1.4, stroke: INDI, seed: 1400 + y, alpha: 0.75 }); }
  [[cx(300) - 70, 300], [cx(800) + 60, 800], [cx(1300) - 50, 1300]].forEach(([x, y], i) => lotus(c, x, y, 0.7, 1, 1500 + i * 20));
  SEA.forEach((f) => { const x = ((f.x + f.d * f.sp * t) % 1400 + 1400) % 1400 - 160; if (Math.abs(f.y - cy) < 620) fish(c, { x, y: f.y, rot: f.d > 0 ? 0 : Math.PI, s: f.s, col: f.col, detail: 0, lw: 1.4, seed: f.seed, alpha: E(t, 3, 5), wig: Math.sin(t * 9 + f.seed) * 0.3 }); });
  const hy = cy - 120 + Math.sin(t * 2) * 10; fish(c, { x: cx(hy) + 10, y: hy, rot: Math.PI / 2 + 0.3 * Math.cos(hy / 320), s: 0.4, seed: 1, wig: Math.sin(t * 12) * 0.3 });
  c.setTransform(c.__base);
  captionAt(c, t, 4.6, 8, [{ t: 'हजारों', c: VERM }, { t: ' मछलियाँ — हर एक ने तालाब छोड़ा था।' }], { size: 44 });
});

// 7 — the old one of the sea laughs
scene(8.5, (c, t) => {
  for (let y = 80; y < 1040; y += 40) { const yy = y + (t * 20) % 40; const p = []; for (let x = 40; x <= 1040; x += 40) p.push([x, yy + Math.sin(x / 40 + y) * 6]); ink(c, p, { close: false, lw: 1.2, stroke: INDI, seed: 1600 + y, alpha: 0.35 }); }
  SEA.slice(0, 70).forEach((f, i) => { const x = ((f.x + f.d * f.sp * t * 0.6) % 1400 + 1400) % 1400 - 160; fish(c, { x, y: 90 + (i * 131) % 860, rot: f.d > 0 ? 0 : Math.PI, s: 0.1, col: f.col, detail: 0, lw: 1.2, seed: f.seed, alpha: 0.45 }); });
  const laugh = t > 3.6, bob = laugh ? Math.sin(t * 16) * 5 : Math.sin(t * 2) * 6;
  fish(c, { x: 410, y: 540 + bob, rot: -0.05, s: 2.0, col: INDI, band: SKY, seed: 77, eye: laugh ? 'closed' : 'open', mouth: laugh ? 0.7 + 0.3 * Math.sin(t * 16) : 0, barbels: true, wig: Math.sin(t * 2.4) * 0.12, lw: 3 });
  if (laugh) for (let k = 0; k < 3; k++) { const a = E(t, 3.6 + k * 0.25, 4 + k * 0.25); ink(c, [[640 + k * 26, 470 - k * 30], [664 + k * 30, 452 - k * 36]], { close: false, lw: 3, seed: 1700 + k, alpha: a }); }
  fish(c, { x: 850 + Math.sin(t * 1.5) * 8, y: 360, rot: Math.PI, s: 0.42, seed: 1, wig: Math.sin(t * 10) * 0.3 });
  captionAt(c, t, 0.6, 3.6, [{ t: 'कोई वापस गया?' }], { size: 52 });
  captionAt(c, t, 3.9, 8.5, [{ t: 'क्यों जाएगा? यहाँ पानी ' }, { t: 'कभी नहीं', c: VERM }, { t: ' सूखता।' }], { size: 46 });
});

// 8 — the pond keeps telling the old story
scene(7.5, (c, t) => {
  c.save(); c.beginPath(); c.rect(0, 0, W, H); c.ellipse(P0.x, P0.y, P0.rx + 34, P0.ry + 34, 0, 0, Math.PI * 2, true); c.clip('evenodd'); hatch(c, 0.9, 0, 0, W, H, 10, 300); c.restore();
  pondWater(c, 1, '#b8c2a8');
  const cloud = E(t, 0.6, 4);
  ink(c, ell(P0.x + 20, P0.y - 120, 150 * cloud, 70 * cloud, 22, 0.12, t), { fill: 'rgba(27,18,11,.85)', lw: 2.4, seed: 1800, alpha: cloud });
  if (cloud > 0.5) { c.save(); c.globalAlpha = E(t, 2, 3.5); c.strokeStyle = PAPER; c.lineWidth = 2; for (let k = 0; k < 3; k++) { c.beginPath(); c.arc(P0.x - 30 + k * 50, P0.y - 125, 10 + k * 4, 0.2, 5.6); c.stroke(); } c.restore(); }
  fish(c, { x: P0.x - 60, y: P0.y + 10, rot: 0, s: 0.62, col: '#6e7a45', band: OCHRE, seed: 9, barbels: true, mouth: 0.5 + 0.5 * Math.sin(t * 9), wig: Math.sin(t * 3) * 0.1 });
  for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2 + 0.3, x = P0.x - 40 + Math.cos(a) * 225 + Math.sin(t * 40 + k) * 1.6, y = P0.y + 20 + Math.sin(a) * 160; fish(c, { x, y, rot: Math.atan2(P0.y - y, P0.x - 40 - x), s: 0.24, col: [TURM, OCHRE, PINK, '#d9692f'][k % 4], band: TURM, eye: 'scared', seed: 200 + k }); }
  ringStones(c);
  c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = 'rgba(150,110,60,.25)'; c.fillRect(0, 0, W, H); c.restore();
  captionAt(c, t, 2.2, 7.5, [{ t: 'और तालाब ' }, { t: 'वही कहानी', c: VERM }, { t: ' सुनाता रहा।' }], { size: 48 });
});

// 9 — the stones were never real: 10th / 12th / Graduation / फिर?
const ST = [[260, 330, 112, '10th'], [790, 300, 112, '12th'], [300, 790, 135, 'Graduation'], [800, 770, 105, 'फिर?']];
const FR = ST.map((s, i) => { const R = rng(40 + i), a = []; for (let k = 0; k < 11; k++) { const ang = R() * 6.28, d = R() * s[2] * 0.6; a.push({ x: s[0] + Math.cos(ang) * d, y: s[1] + Math.sin(ang) * d * 0.8, vx: Math.cos(ang) * (80 + R() * 160), vy: Math.sin(ang) * (60 + R() * 120) - 120, r: s[2] * (0.18 + R() * 0.14), seed: 3000 + i * 20 + k }); } return a; });
scene(8.5, (c, t) => {
  for (let y = 60; y < 1040; y += 38) { const p = []; for (let x = 70; x <= 1010; x += 40) p.push([x, y + Math.sin(x / 40 + y + t) * 6]); ink(c, p, { close: false, lw: 1.2, stroke: INDI, seed: 3500 + y, alpha: 0.3 }); }
  ST.forEach(([x, y, r, l], i) => {
    const ap = E(t, 0.3 + i * 0.45, 0.8 + i * 0.45), br = 3.4 + i * 0.4, bt = t - br;
    if (bt < 0) {
      stone(c, x, y - (1 - ap) * 60, r, 600 + i, { alpha: ap, lw: 3 });
      if (bt > -0.4) { c.save(); c.globalAlpha = ap; for (let k = 0; k < 3; k++) ink(c, [[x - r * 0.2 + k * 14, y - r * 0.6], [x - r * 0.1 + k * 10, y], [x + k * 16, y + r * 0.5]], { close: false, lw: 1.8, seed: 3600 + i * 5 + k }); c.restore(); }
      c.save(); c.globalAlpha = ap; c.font = (l.length > 6 ? 46 : 64) + 'px "Rozha One"'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = INK; c.fillText(l, x, y + 4); c.restore();
    } else {
      FR[i].forEach((f) => { const tt = bt; stone(c, f.x + f.vx * tt, f.y + f.vy * tt + 260 * tt * tt, f.r * (1 - E(tt, 0.4, 1.4) * 0.6), f.seed, { alpha: 1 - E(tt, 0.3, 1.3) }); });
      c.save(); c.globalAlpha = 1 - E(bt, 0, 0.5); c.font = (l.length > 6 ? 46 : 64) + 'px "Rozha One"'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = INK; c.fillText(l, x, y + 4 - bt * 60); c.restore();
    }
  });
  const hx = lerp(-120, 1220, E(t, 4.4, 8.3));
  fish(c, { x: hx, y: 545 + Math.sin(t * 3) * 14, rot: Math.cos(t * 3) * 0.15, s: 0.75, seed: 1, wig: Math.sin(t * 12) * 0.3 });
  captionAt(c, t, 5.0, 8.5, [{ t: 'वो पत्थर ' }, { t: 'असली नहीं', c: VERM }, { t: ' होते।' }], { font: 'Rozha One', size: 58, y: 880 });
}, 'crumble');

// 10 — at 16 she left; now people her age swim with her
scene(8, (c, t) => {
  for (let y = 90; y < 1040; y += 40) { const p = []; const off = (t * 140) % 40; for (let x = 40 - off; x <= 1080; x += 40) p.push([x, y + Math.sin((x + t * 140) / 40 + y) * 6]); ink(c, p, { close: false, lw: 1.3, stroke: INDI, seed: 3800 + y, alpha: 0.45 }); }
  const mp = E(t, 0.3, 1.2);
  c.save(); c.translate(800, 245); c.scale(mp * 0.9, mp * 0.9);
  for (let k = 0; k < 20; k++) { const a = k / 20 * Math.PI * 2 + t * 0.3; ink(c, [[Math.cos(a - 0.1) * 92, Math.sin(a - 0.1) * 92], [Math.cos(a) * 122, Math.sin(a) * 122], [Math.cos(a + 0.1) * 92, Math.sin(a + 0.1) * 92]], { fill: k % 2 ? VERM : TURM, lw: 1.8, seed: 3900 + k }); }
  ink(c, ell(0, 0, 92, 92, 26), { fill: '#f6ead0', lw: 3, seed: 3950 }); ink(c, ell(0, 0, 78, 78, 26), { lw: 1.4, seed: 3951 });
  c.font = '92px "Rozha One"'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = VERM; c.fillText('16', 0, 8);
  c.restore();
  const hx = 520 + Math.sin(t * 1.2) * 30, hy = 560 + Math.cos(t * 1.6) * 16;
  const cols = [TURM, PINK, LEAF, SKY, OCHRE, '#d9692f'];
  for (let k = 1; k <= 6; k++) { const side = k % 2 ? -1 : 1, row = Math.ceil(k / 2); const j = E(t, 1.2 + k * 0.45, 2.2 + k * 0.45); const tx = hx - row * 140, ty = hy + side * row * 95; fish(c, { x: lerp(-200, tx, j), y: ty + Math.sin(t * 2 + k) * 10, rot: 0, s: 0.5, col: cols[k - 1], band: k % 2 ? VERM : TURM, seed: 400 + k, alpha: j, wig: Math.sin(t * 11 + k) * 0.3 }); }
  fish(c, { x: hx, y: hy, rot: 0, s: 0.6, seed: 1, wig: Math.sin(t * 12) * 0.3 });
  captionAt(c, t, 1.6, 8, [{ t: '16 की उम्र में मैंने ' }, { t: 'तालाब', c: VERM }, { t: ' छोड़ा।' }], { size: 50 });
});

// 11 — out of the pond, the river runs on (no text: the creator adds her own CTA)
scene(9, (c, t) => {
  const PY = 395, cxr = (y) => 540 + Math.sin((y - PY) / 110) * 70 * Math.min(1, (y - PY) / 300), hw = (y) => 22 + (y - PY) * 0.36;
  const reach = PY + 760 * E(t, 0.2, 3.2);
  c.save(); c.beginPath(); c.rect(0, 0, W, reach); c.clip();
  const Lp = [], Rp = []; for (let y = PY - 30; y <= 1140; y += 30) { Lp.push([cxr(y) - hw(y), y]); Rp.push([cxr(y) + hw(y), y]); }
  ink(c, Lp.concat(Rp.reverse()), { fill: '#a9c8d4', lw: 3, seed: 4000 });
  for (let k = 0; k < 24; k++) { const y = PY + ((k * 32 + t * 50) % 760); const p = []; for (let x = cxr(y) - hw(y) + 10; x <= cxr(y) + hw(y) - 10; x += 26) p.push([x, y + Math.sin(x / 26 + k) * 5]); if (p.length > 1) ink(c, p, { close: false, lw: 1.4, stroke: INDI, seed: 4100 + k, alpha: 0.8 }); }
  [[cxr(700) - 80, 700], [cxr(880) + 120, 880], [cxr(1000) - 190, 1000]].forEach(([x, y], i) => lotus(c, x, y, 0.8, E(t, 2 + i * 0.4, 3 + i * 0.4), 4200 + i * 20));
  for (let k = 0; k < 9; k++) { const y = PY + 150 + ((k * 97 + t * 70) % 620); fish(c, { x: cxr(y) + ((k * 53) % 140 - 70) * (hw(y) / 200), y, rot: Math.PI / 2, s: 0.2, col: [TURM, PINK, LEAF, OCHRE, SKY][k % 5], detail: 0, lw: 1.5, seed: 4300 + k, alpha: E(t, 2.5, 3.5), wig: Math.sin(t * 9 + k) * 0.3 }); }
  c.restore();
  // grass on the banks
  for (let k = 0; k < 40; k++) { const y = PY + 40 + (k * 61) % 680; if (y > reach) continue; const sd = k % 2 ? 1 : -1, x = cxr(y) + sd * (hw(y) + 30 + (k * 37) % 90); for (let g = -1; g <= 1; g++) ink(c, [[x, y], [x + g * 9, y - 26]], { close: false, lw: 1.6, stroke: LEAF, seed: 4400 + k * 3 + g }); }
  c.save(); c.translate(540, 245); c.scale(0.52, 0.52); c.translate(-P0.x, -P0.y);
  pondWater(c); school(c, t, {}); ringStones(c, { gap: Math.PI / 2 });
  c.restore();
  const hy = lerp(330, 960, E(t, 0.8, 7.5));
  fish(c, { x: cxr(Math.max(PY, hy)), y: hy, rot: Math.PI / 2 + Math.cos((hy - PY) / 110) * 0.35, s: 0.4, seed: 1, wig: Math.sin(t * 12) * 0.3 });
}, 'river');

// =================== driver ===================
const STARTS = []; { let a = 0; SC.forEach((s) => { STARTS.push(a); a += s.d; }); }
const TOTAL = STARTS[STARTS.length - 1] + SC[SC.length - 1].d;
const XF = 0.7; // crossfade seconds
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const offA = document.createElement('canvas'), offB = document.createElement('canvas'); offA.width = offB.width = W; offA.height = offB.height = H;
const ZOOM = SHOW_TEXT ? SC.map(() => 1) : [1.24, 1.12, 1.22, 1.24, 1.2, 1.1, 1.32, 1.26, 1.0, 1.15, 1.18];
function renderScene(c, i, t) { c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.drawImage(paper, 0, 0); c.save(); c.translate(W / 2, H / 2); c.scale(ZOOM[i], ZOOM[i]); c.translate(-W / 2, -H / 2); c.__base = c.getTransform(); SC[i].fn(c, Math.max(0, t)); c.restore(); }
window.drawFrame = (f) => {
  BOIL = Math.floor(f / 3) % 4;
  const T = f / FPS; let i = 0; while (i < SC.length - 1 && T >= STARTS[i + 1]) i++;
  const t = T - STARTS[i], rem = SC[i].d - t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (i < SC.length - 1 && rem < XF) {
    renderScene(offA.getContext('2d'), i, t); renderScene(offB.getContext('2d'), i + 1, 0);
    ctx.globalAlpha = 1; ctx.drawImage(offA, 0, 0); ctx.globalAlpha = ease(1 - rem / XF); ctx.drawImage(offB, 0, 0); ctx.globalAlpha = 1;
  } else renderScene(ctx, i, t);
  if (T < 0.6) { ctx.fillStyle = 'rgba(27,18,11,' + (1 - T / 0.6) + ')'; ctx.fillRect(0, 0, W, H); }
  if (T > TOTAL - 0.8) { ctx.fillStyle = 'rgba(27,18,11,' + clamp((T - (TOTAL - 0.8)) / 0.8) + ')'; ctx.fillRect(0, 0, W, H); }
  if (SHOW_BORDER) border(ctx);
};
window.FILM = { TOTAL, FPS, STARTS, CUES: SC.map((s, i) => ({ start: STARTS[i], d: s.d, cue: s.cue })) };
window.READY = (async () => { await Promise.all(['700 50px Amita', '50px "Rozha One"'].map((f) => document.fonts.load(f, 'पत्थर RIVER 16'))); window.drawFrame(0); return true; })();
