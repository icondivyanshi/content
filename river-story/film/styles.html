<!doctype html>
<html><head><meta charset="utf-8"><title>Style options — the leap</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="cv" width="1080" height="1080"></canvas>
<script src="art.js"></script>
<script>
// One moment of the story (the leap over the stones toward the river), drawn in four Indian art traditions.
const cv = document.getElementById('cv'), c = cv.getContext('2d');
Object.assign(P0, { x: 420, y: 540, rx: 300, ry: 360 });
const GAP = 0, HERO = { x: 815, y: 470, rot: -0.38, s: 0.62 };
const ringPos = () => RING.filter((s) => Math.abs(Math.atan2(Math.sin(s.t - GAP), Math.cos(s.t - GAP))) >= 0.14)
  .map((s) => ({ ...s, x: P0.x + Math.cos(s.t) * (P0.rx + 34), y: P0.y + Math.sin(s.t) * (P0.ry + 34) }));
const fishPos = (t = 2) => SCHOOL.map((f, i) => { const a = f.a0 + t * f.sp, r = f.r; return { ...f, i, x: P0.x + Math.cos(a) * P0.rx * r, y: P0.y + Math.sin(a) * P0.ry * r, rot: a + (f.sp > 0 ? Math.PI / 2 : -Math.PI / 2) }; });
const riverX = (y) => 960 + Math.sin(y / 140) * 18;
function at(x, y, rot, s, fn) { c.save(); c.translate(x, y); c.rotate(rot); const up = Math.cos(rot) < 0 ? -1 : 1; c.scale(s, s * up); fn(); c.restore(); }
function pathOf(pts) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); }
const TAIL = [[-62, 0], [-122, -50], [-108, -14], [-104, 0], [-108, 14], [-122, 50]];

// ---------------- 1. MADHUBANI ----------------
function madhubani() {
  c.drawImage(paper, 0, 0);
  hatch(c, 1, 790, 0, 890, 1080, 9, 300);
  const Lp = [], Rp = []; for (let y = -40; y <= 1120; y += 40) { Lp.push([riverX(y) - 75, y]); Rp.push([riverX(y) + 140, y]); }
  ink(c, Lp.concat(Rp.reverse()), { fill: '#a9c8d4', lw: 3, seed: 950 });
  for (let k = 0; k < 28; k++) { const y = k * 40 + 10, p = []; for (let x = riverX(y) - 60; x <= 1080; x += 34) p.push([x, y + Math.sin(x / 34 + k) * 6]); ink(c, p, { close: false, lw: 1.4, stroke: INDI, seed: 960 + k, alpha: 0.8 }); }
  [[985, 200], [1010, 820]].forEach(([x, y], i) => lotus(c, x, y, 0.8, 1, 990 + i * 20));
  pondWater(c); school(c, 2, {}); ringStones(c, { gap: GAP });
  ink(c, ell(HERO.x, 600, 34, 9, 12), { fill: 'rgba(27,18,11,.25)', stroke: null, seed: 5 });
  fish(c, { ...HERO, seed: 1, wig: 0.25 });
}

// ---------------- 2. GOND ----------------
const G = { bg: '#120e0b', pond: '#138f86', cols: ['#e0337a', '#f5c400', '#f26b1d', '#4bb543', '#22b3d6', '#9b59d0'], white: '#fbf4e6' };
function gondFish(col, pat, s, detail = true) {
  c.save(); c.fillStyle = shadeG(col, 0.75); pathOf(TAIL); c.fill();
  c.strokeStyle = pat; c.lineWidth = 2.2 / s; c.lineCap = 'round';
  for (let k = -3; k <= 3; k++) { c.setLineDash([5 / s * 1.5, 6 / s * 1.2]); c.beginPath(); c.moveTo(-68, 0); c.lineTo(-118, k * 14); c.stroke(); }
  c.setLineDash([]);
  c.fillStyle = col; pathOf(BODY); c.fill();
  c.save(); pathOf(BODY); c.clip();
  // Gond "digna": rows of dashes following the body
  const step = detail ? 7 : 10;
  for (let y = -48, r = 0; y <= 48; y += step, r++) {
    c.strokeStyle = r % 3 === 0 ? G.white : pat; c.lineWidth = (detail ? 2.4 : 3) / s;
    c.setLineDash([(detail ? 7 : 9), (detail ? 5 : 6)]); c.lineDashOffset = r * 4;
    c.beginPath(); for (let x = -70; x <= 70; x += 6) { const yy = y * (1 - Math.pow(Math.abs(x - 15) / 95, 2) * 0.35) + Math.sin(x / 22) * 2; x === -70 ? c.moveTo(x, yy) : c.lineTo(x, yy); } c.stroke();
  }
  c.setLineDash([]);
  c.fillStyle = shadeG(col, 0.8); c.beginPath(); c.ellipse(78, 0, 30, 60, 0, 0, 7); c.fill();
  c.restore();
  c.fillStyle = G.white; for (let y = -30; y <= 30; y += 10) { c.beginPath(); c.arc(52, y, 2.6, 0, 7); c.fill(); }
  c.beginPath(); c.arc(76, -9, 13, 0, 7); c.fill(); c.fillStyle = '#111'; c.beginPath(); c.arc(78, -9, 6.5, 0, 7); c.fill();
  c.restore();
}
function shadeG(hex, k) { const n = parseInt(hex.slice(1), 16); const f = (v) => Math.round(Math.min(255, v * k)); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; }
function gond() {
  c.fillStyle = G.bg; c.fillRect(0, 0, W, H);
  const R = rng(4); for (let i = 0; i < 900; i++) { c.fillStyle = 'rgba(255,240,220,.05)'; c.fillRect(R() * W, R() * H, 2, 2); }
  // river: blue band with flowing dash rows
  c.save(); c.beginPath(); c.moveTo(riverX(-40) - 75, -40); for (let y = -40; y <= 1120; y += 20) c.lineTo(riverX(y) - 75, y); c.lineTo(1120, 1120); c.lineTo(1120, -40); c.closePath(); c.fillStyle = '#1d5fb8'; c.fill(); c.clip();
  for (let k = 0; k < 40; k++) { const y = k * 28; c.strokeStyle = k % 2 ? '#7fd3ff' : G.white; c.lineWidth = 3; c.setLineDash([12, 9]); c.lineDashOffset = k * 7; c.beginPath(); for (let x = 860; x <= 1080; x += 10) { const yy = y + Math.sin(x / 26 + k) * 6; x === 860 ? c.moveTo(x, yy) : c.lineTo(x, yy); } c.stroke(); }
  c.restore(); c.setLineDash([]);
  // pond: teal with concentric dotted rings
  c.fillStyle = G.pond; c.beginPath(); c.ellipse(P0.x, P0.y, P0.rx, P0.ry, 0, 0, 7); c.fill();
  for (let k = 1; k <= 9; k++) { const rx = P0.rx * k / 10, ry = P0.ry * k / 10, n = Math.round(30 * k); c.fillStyle = k % 2 ? 'rgba(255,255,255,.55)' : 'rgba(10,60,60,.6)'; for (let i = 0; i < n; i++) { const a = i / n * 6.283; c.beginPath(); c.arc(P0.x + Math.cos(a) * rx, P0.y + Math.sin(a) * ry, 2.4, 0, 7); c.fill(); } }
  fishPos().forEach((f) => at(f.x, f.y, f.rot, f.s * 1.15, () => gondFish(G.cols[f.i % G.cols.length], G.cols[(f.i + 2) % G.cols.length], f.s * 1.15, false)));
  // stones: earthy blobs filled with seed-dot clusters
  ringPos().forEach((s, i) => {
    const p = stoneShape(s.x, s.y, s.r, s.seed); pathOf(p); c.fillStyle = ['#b9772e', '#8e3b6b', '#c99a3b', '#6b4a8e'][i % 4]; c.fill();
    c.save(); pathOf(p); c.clip(); c.fillStyle = 'rgba(255,245,225,.85)';
    for (let k = 0; k < 14; k++) { const a = k * 2.4, d = Math.sqrt(k / 14) * s.r * 0.9; c.beginPath(); c.ellipse(s.x + Math.cos(a) * d, s.y + Math.sin(a) * d * 0.8, 3.2, 2, a, 0, 7); c.fill(); }
    c.restore();
  });
  c.fillStyle = 'rgba(255,220,120,.18)'; c.beginPath(); c.ellipse(HERO.x, 600, 40, 10, 0, 0, 7); c.fill();
  at(HERO.x, HERO.y, HERO.rot, HERO.s * 1.3, () => gondFish('#e3261f', '#f5c400', HERO.s * 1.3, true));
}

// ---------------- 3. WARLI ----------------
const WH = '#f4ecdc';
function wline(pts, lw = 2.6, close = false, seed = 0) { ink(c, pts, { close, stroke: WH, lw, jit: 1.3, seed }); }
function warliFish(s, solid = false, seed = 0) {
  if (solid) { pathOf(BODY); c.fillStyle = WH; c.fill(); pathOf(TAIL); c.fill(); c.fillStyle = '#8b4226'; c.beginPath(); c.arc(74, -9, 7, 0, 7); c.fill(); return; }
  ink(c, BODY, { stroke: WH, lw: 2.2, jit: 1, seed });
  ink(c, [[-62, 0], [-115, -40], [-115, 40]], { stroke: WH, lw: 2.2, jit: 1, seed: seed + 1 });
  wline([[-58, 0], [62, 0]], 1.8, false, seed + 2);
  for (let x = -45; x < 50; x += 14) { wline([[x, 0], [x - 9, -24]], 1.6, false, seed + 3 + x); wline([[x, 0], [x - 9, 24]], 1.6, false, seed + 40 + x); }
  c.fillStyle = WH; c.beginPath(); c.arc(76, -9, 5, 0, 7); c.fill();
}
function warli() {
  c.fillStyle = '#8b4226'; c.fillRect(0, 0, W, H);
  const R = rng(9); for (let i = 0; i < 60; i++) { const g = c.createRadialGradient(0, 0, 0, 0, 0, 1); c.save(); c.translate(R() * W, R() * H); c.scale(60 + R() * 140, 40 + R() * 100); g.addColorStop(0, R() < 0.5 ? 'rgba(60,20,8,.25)' : 'rgba(170,90,50,.2)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.beginPath(); c.arc(0, 0, 1, 0, 7); c.fill(); c.restore(); }
  for (let i = 0; i < 9000; i++) { c.fillStyle = R() < 0.5 ? 'rgba(40,12,4,.12)' : 'rgba(230,170,120,.08)'; c.fillRect(R() * W, R() * H, 1.5, 1.5); }
  // river: parallel wavy lines + Warli tree on the far bank
  for (let k = 0; k < 7; k++) { const p = []; for (let y = -20; y <= 1100; y += 30) p.push([riverX(y) - 50 + k * 20 + Math.sin(y / 30 + k) * 5, y]); wline(p, 1.8, false, 900 + k); }
  // pond: double ring, rows of dots, small fish
  ink(c, ell(P0.x, P0.y, P0.rx, P0.ry, 48), { stroke: WH, lw: 3, seed: 600 });
  ink(c, ell(P0.x, P0.y, P0.rx - 12, P0.ry - 12, 48), { stroke: WH, lw: 1.6, seed: 601 });
  c.fillStyle = WH; for (let k = 2; k <= 8; k += 2) { const n = 18 * k; for (let i = 0; i < n; i++) { const a = i / n * 6.283; c.beginPath(); c.arc(P0.x + Math.cos(a) * P0.rx * k / 10, P0.y + Math.sin(a) * P0.ry * k / 10, 1.6, 0, 7); c.fill(); } }
  fishPos().filter((f, i) => i % 2 === 0).forEach((f) => at(f.x, f.y, f.rot, f.s * 1.25, () => warliFish(f.s, false, f.seed * 7)));
  // stones: circles with a dot and radiating ticks
  ringPos().forEach((s) => { ink(c, ell(s.x, s.y, s.r * 0.85, s.r * 0.75, 14), { stroke: WH, lw: 2.2, seed: s.seed }); c.fillStyle = WH; c.beginPath(); c.arc(s.x, s.y, 3, 0, 7); c.fill(); });
  // the leap: dashed arc of the jump
  c.save(); c.strokeStyle = WH; c.lineWidth = 2; c.setLineDash([3, 10]); c.lineCap = 'round'; c.beginPath(); c.moveTo(650, 560); c.quadraticCurveTo(780, 360, 930, 560); c.stroke(); c.restore();
  at(HERO.x, HERO.y, HERO.rot, HERO.s, () => warliFish(HERO.s, true));
  // Warli sun
  ink(c, ell(170, 130, 50, 50, 20), { stroke: WH, lw: 2.6, seed: 700 }); for (let k = 0; k < 16; k++) { const a = k / 16 * 6.283; wline([[170 + Math.cos(a) * 62, 130 + Math.sin(a) * 62], [170 + Math.cos(a) * 82, 130 + Math.sin(a) * 82]], 2, false, 710 + k); }
}

// ---------------- 4. SHADOW PUPPET (Tholu Bommalata) ----------------
function holes(pts, gap, r, col = 'rgba(255,226,150,.95)') { c.fillStyle = col; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; const n = Math.max(1, Math.floor(Math.hypot(b[0] - a[0], b[1] - a[1]) / gap)); for (let k = 0; k < n; k++) { c.beginPath(); c.arc(lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n), r, 0, 7); c.fill(); } } }
function puppetFish(col, s, hero = false) {
  const lw = (hero ? 4 : 2) / s;
  c.fillStyle = col; c.strokeStyle = '#2b1205'; c.lineWidth = lw;
  pathOf(TAIL); c.fill(); c.stroke();
  pathOf([[22, -40], [-4, -74], [-30, -38]]); c.fill(); c.stroke();
  pathOf(BODY); c.fill(); c.stroke();
  // punched decoration: inner contour of holes, scale rosettes
  holes(BODY_IN, hero ? 9 : 16, hero ? 2.2 : 3.5);
  c.fillStyle = 'rgba(255,226,150,.95)';
  if (hero) for (let gx = -40; gx <= 30; gx += 18) for (let gy = -24; gy <= 24; gy += 16) { c.beginPath(); c.arc(gx + (gy % 32 ? 9 : 0), gy, 3.2, 0, 7); c.fill(); }
  c.strokeStyle = '#2b1205'; c.lineWidth = (hero ? 2.5 : 1.5) / s; for (let k = -2; k <= 2; k++) { c.beginPath(); c.moveTo(-70, 0); c.lineTo(-116, k * 18); c.stroke(); }
  c.fillStyle = '#fff3c8'; c.beginPath(); c.arc(76, -9, 12, 0, 7); c.fill(); c.strokeStyle = '#2b1205'; c.lineWidth = 3 / s; c.stroke();
  c.fillStyle = '#2b1205'; c.beginPath(); c.arc(78, -9, 5, 0, 7); c.fill();
}
function shadow() {
  const g = c.createRadialGradient(560, 470, 60, 540, 540, 820); g.addColorStop(0, '#fff1b8'); g.addColorStop(0.35, '#ffc456'); g.addColorStop(0.7, '#d9661a'); g.addColorStop(1, '#3a1003'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  const R = rng(12); for (let i = 0; i < 4000; i++) { c.fillStyle = 'rgba(120,50,0,.06)'; c.fillRect(R() * W, R() * H, 2, 2); }
  c.save(); c.globalAlpha = 0.1; c.strokeStyle = '#6b2a00'; for (let x = 0; x < W; x += 3) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 20, H); c.stroke(); } c.restore(); // cloth weave
  // river (translucent blue leather) with punched waves
  c.save(); c.globalAlpha = 0.75; c.fillStyle = '#1e7fa8'; c.beginPath(); c.moveTo(riverX(-40) - 75, -40); for (let y = -40; y <= 1120; y += 20) c.lineTo(riverX(y) - 75, y); c.lineTo(1120, 1120); c.lineTo(1120, -40); c.closePath(); c.fill(); c.restore();
  c.strokeStyle = '#2b1205'; c.lineWidth = 4; c.beginPath(); for (let y = -40; y <= 1120; y += 20) y === -40 ? c.moveTo(riverX(y) - 75, y) : c.lineTo(riverX(y) - 75, y); c.stroke();
  for (let k = 0; k < 18; k++) { const y = k * 62 + 20; c.fillStyle = 'rgba(255,226,150,.9)'; for (let x = riverX(y) - 50; x < 1080; x += 14) { c.beginPath(); c.arc(x, y + Math.sin(x / 22 + k) * 8, 2.6, 0, 7); c.fill(); } }
  // pond: translucent green-teal leather, punched rings
  c.save(); c.globalAlpha = 0.72; c.fillStyle = '#2f8a6a'; c.beginPath(); c.ellipse(P0.x, P0.y, P0.rx, P0.ry, 0, 0, 7); c.fill(); c.restore();
  c.strokeStyle = '#2b1205'; c.lineWidth = 5; c.beginPath(); c.ellipse(P0.x, P0.y, P0.rx, P0.ry, 0, 0, 7); c.stroke();
  for (let k = 3; k <= 9; k += 2) holes(ell(P0.x, P0.y, P0.rx * k / 10, P0.ry * k / 10, 60, 0.03), 16, 2.4);
  const pc = ['rgba(220,60,30,.7)', 'rgba(245,190,30,.75)', 'rgba(90,170,70,.7)', 'rgba(200,80,140,.7)'];
  fishPos().filter((f, i) => i % 2 === 0).forEach((f) => at(f.x, f.y, f.rot, f.s * 1.3, () => puppetFish(pc[f.i % 4], f.s * 1.3)));
  // stones: dark leather silhouettes
  ringPos().forEach((s) => { const p = stoneShape(s.x, s.y, s.r, s.seed); pathOf(p); c.fillStyle = '#2b1205'; c.fill(); holes(p.map(([x, y]) => [s.x + (x - s.x) * 0.55, s.y + (y - s.y) * 0.55]), 12, 1.8, 'rgba(255,200,110,.75)'); });
  // the hero puppet, with its control stick
  c.strokeStyle = '#3a1a06'; c.lineWidth = 7; c.lineCap = 'round'; c.beginPath(); c.moveTo(HERO.x - 10, HERO.y + 30); c.lineTo(HERO.x - 120, 1100); c.stroke();
  at(HERO.x, HERO.y, HERO.rot, HERO.s * 1.25, () => puppetFish('rgba(230,50,20,.88)', HERO.s * 1.25, true));
  const v = c.createRadialGradient(540, 540, 380, 540, 540, 800); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(20,5,0,.6)'); c.fillStyle = v; c.fillRect(0, 0, W, H);
}

window.STYLES = { madhubani, gond, warli, shadow };
window.drawStyle = (name) => { BOIL = 0; c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; STYLES[name](); };
</script></body></html>
